<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b64"/>
      <stop offset="100%" stop-color="#021024"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#C1E8FF"/>
      <stop offset="100%" stop-color="#7DA0CA"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C1E8FF"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Institutional Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#C1E8FF" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="rgba(193, 232, 255, 0.2)" stroke-width="1.2" />

  <!-- Academic Graduation Mortarboard Rhombus -->
  <polygon points="32,15 54,26 32,37 10,26" fill="url(#capGrad)" />

  <!-- Skullcap Base with Depth -->
  <path d="M19 32.5 v7.5 c0 5.5 5.8 10 13 10 s13 -4.5 13 -10 v-7.5 l-13 6.5 z" fill="#5483B3" opacity="0.95" />

  <!-- Center Pivot Button -->
  <circle cx="32" cy="26" r="3" fill="#021024" />
  <circle cx="32" cy="26" r="1.5" fill="#C1E8FF" />

  <!-- Tassel Cord & Hanging Drop -->
  <path d="M49 27.5 v14" stroke="url(#tasselGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="49" cy="43" r="2.2" fill="#38bdf8" />

  <!-- Computing & AI Circuit Nodes -->
  <circle cx="22" cy="48" r="1.6" fill="#C1E8FF" />
  <circle cx="32" cy="52" r="1.8" fill="#C1E8FF" />
  <circle cx="42" cy="48" r="1.6" fill="#C1E8FF" />
</svg>